# T8.11 — BOK / KOSIS industry labels → 18 marketsim.layer1.build_io.CODES.
# Optional flavour overlay (ADR-015). Not loaded by the engine; scripts/fetch_bok_io.py
# reads this file. Destinations are the existing 18 codes only — no second sector list.
#
# Sources:
# - Bank of Korea Input-Output Tables (산업연관표), 2015 / 2020 benchmark
#   통합대분류 33, 통합중분류 83 (ECOS 2.2; https://ecos.bok.or.kr/)
# - KOSIS republish of the same tables (https://kosis.kr/, 작성기관 한국은행)
# - KSIC Rev. 10 sections A–U and manufacturing divisions 10–34
#   (Statistics Korea; used when the workbook is a KOSIS industry extract)
#
# Each `sources` row: `weights` are shares and MUST sum to 1.0.
# Short codes (01, C) are namespaced by `classification` so BOK-33 "10"
# (fabricated metal) does not collide with KSIC "10" (food). Names always match.
#
# Splits on electronics / transport / finance are working assumptions from
# Korean output composition (semiconductor-heavy ICT, shipbuilding in other
# transport). They are not a retune of US seed elasticities.

schema: bok-kosis-to-18
codes_ref: marketsim.layer1.build_io.CODES

